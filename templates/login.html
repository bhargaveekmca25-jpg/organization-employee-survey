<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #10264f, #2455bd, #376be5);
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 35px;
    border-radius: 13px;
    box-shadow: 0 10px 35px #10264f55;
}

.icon {
    text-align: center;
    font-size: 42px;
}

h2 {
    text-align: center;
    color: #173b79;
}

.subtitle {
    text-align: center;
    font-size: 12px;
    color: #718096;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-size: 13px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d5dfed;
    background: #f3f7fd;
    border-radius: 6px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: linear-gradient(100deg, #174db5, #3269e8);
    color: white;
    border: 0;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.message {
    padding: 10px;
    background: #fff0f0;
    color: #c62828;
    font-size: 13px;
    border-radius: 5px;
}

.back {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #2864dc;
    text-decoration: none;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">🔐</div>

    <h2>Admin Login</h2>

    <p class="subtitle">
        Employee Survey Form Analysis System
    </p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label for="username">Username</label>

        <input type="text"
               id="username"
               name="username"
               autocomplete="username"
               required>

        <label for="password">Password</label>

        <input type="password"
               id="password"
               name="password"
               autocomplete="current-password"
               required>

        <button type="submit">Login to Dashboard</button>

    </form>

    <a href="{{ url_for('home') }}" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
