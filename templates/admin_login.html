<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Admin Login</title>
<style>body{font-family:Arial;background:#f1f5f9;display:grid;place-items:center;min-height:100vh} .box{background:white;padding:28px;border-radius:12px;width:360px;box-shadow:0 4px 20px #0001} input{width:100%;padding:11px;margin:10px 0;border:1px solid #cbd5e1;border-radius:7px} button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:7px;font-weight:bold;cursor:pointer} .err{color:red;font-size:12px;margin-bottom:10px}</style></head>
<body><div class="box"><h2>Admin Login</h2><p style="font-size:12px;color:#64748b">Password: admin123</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="POST"><input type="password" name="password" placeholder="Enter password" required><button type="submit">Login</button></form><a href="/" style="font-size:12px;display:block;margin-top:12px;text-align:center">Back to Home</a></div></body></html>
