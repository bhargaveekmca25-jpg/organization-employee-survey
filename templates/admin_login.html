<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 360px;
            text-align: center;
        }
        .login-box h3 {
            margin-bottom: 20px;
            color: #1e293b;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-box button:hover {
            background: #1d4ed8;
        }
        .error-msg {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
            border: 1px solid #fecaca;
        }
        .back-link {
            display: block;
            margin-top: 16px;
            font-size: 12px;
            color: #64748b;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h3>🛡️ Admin Login</h3>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/admin" method="POST">
            <input 
                type="password" 
                name="password" 
                placeholder="Enter Password (admin123)" 
                required 
                autofocus
            >
            <button type="submit">Login</button>
        </form>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

</body>
</html>
