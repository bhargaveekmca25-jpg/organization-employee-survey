<!DOCTYPE html>
<html>
<head>
    <title>Employee Survey System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin:0; }
        .header { background: linear-gradient(135deg, #0f1b4d, #1e3c9c); color:white; padding:40px; text-align:center; }
        .header h1 { margin:0; font-size:32px; }
        .header p { opacity:0.9; margin-top:8px; font-size:16px; }
        .container { max-width: 800px; margin: 30px auto; background: white; padding:30px; border-radius:10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align:center; }
        .btn { display:inline-block; padding:12px 25px; margin:10px; border-radius:5px; text-decoration:none; color:white; font-weight:bold; }
        .btn-primary { background:#007bff; }
        .btn-success { background:#28a745; }
        .btn:hover { opacity:0.9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Organization Employee Survey</h1>
        <p>Employee Feedback & Analysis System</p>
    </div>
    <div class="container">
        <h2>Welcome to Employee Feedback Portal</h2>
        <p>This system collects anonymous feedback for any organization. Your responses help improve workplace culture.</p>
        <div style="margin-top:25px;">
            <a href="/survey" class="btn btn-primary">Take Survey</a>
            <a href="/admin" class="btn btn-success">View Responses</a>
        </div>
    </div>
</body>
</html>
