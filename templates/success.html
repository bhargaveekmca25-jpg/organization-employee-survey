<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Survey Submitted</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            padding: 20px;
        }

        .box {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 45px 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #16a34a;
            margin-bottom: 12px;
        }

        p {
            color: #475569;
            line-height: 1.6;
        }

        .company {
            color: #1d4ed8;
            font-weight: bold;
        }

        .buttons {
            margin-top: 25px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 5px;
            font-weight: bold;
        }

        .home {
            background: #475569;
            color: white;
        }

        .survey {
            background: #2563eb;
            color: white;
        }

    </style>

</head>


<body>

<div class="box">

    <div class="icon">
        ✅
    </div>

    <h1>Survey Submitted Successfully!</h1>

    <p>
        Thank you for submitting your employee feedback.
    </p>

    {% if company_name %}

    <p>
        Your response has been recorded for
        <span class="company">
            {{ company_name }}
        </span>.
    </p>

    {% endif %}


    <div class="buttons">

        <a href="/"
           class="home">
            ← Home
        </a>

        <a href="/survey"
           class="survey">
            Submit Another Response
        </a>

    </div>

</div>

</body>

</html>
