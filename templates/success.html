<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Survey Submitted</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #eef3fb;
    padding: 20px;
}

.card {
    background: white;
    width: 100%;
    max-width: 600px;
    padding: 40px 25px;
    border-radius: 14px;
    box-shadow: 0 8px 30px #d9e2ef;
    text-align: center;
}

.icon {
    color: #20a464;
    font-size: 55px;
}

h1 {
    color: #239653;
    font-size: 25px;
}

p {
    color: #65758b;
    line-height: 1.7;
}

a {
    display: inline-block;
    margin-top: 15px;
    background: #2864dc;
    color: white;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">✓</div>

    <h1>Survey Submitted Successfully!</h1>

    <p>
        Thank you for submitting your feedback to
        {{ organization_name }}.
    </p>

    <p>Your response has been recorded.</p>

    <a href="{{ url_for('home') }}">Back to Home</a>

</div>

</body>
</html>
