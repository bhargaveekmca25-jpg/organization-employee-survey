<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .icon {
            width: 60px;
            height: 60px;
            background: #16a34a;
            color: white;
            font-size: 32px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            border: 3px solid black;
        }

        .box h2 {
            color: #15803d;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .box p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .company-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin: 12px 0;
            border: 1px solid #93c5fd;
        }

        .buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn {
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-home {
            background: #334155;
            color: white;
        }

        .btn-again {
            background: #2563eb;
            color: white;
        }

        .btn-analysis {
            background: #16a34a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="icon">✓</div>

        <h2>Survey Submitted Successfully!</h2>

        <p>Thank you for submitting your employee feedback.</p>

        <!-- Company Name Yaha Ayega -->
        {% if company %}
        <div class="company-badge">
            🏢 Submitted for: {{ company }}
        </div>
        {% endif %}

        <p style="font-size:11px; margin-top:5px;">
            Your response has been saved anonymously for analysis.
        </p>

        <div class="buttons">
            <a href="/" class="btn btn-home">← Home</a>
            <a href="/survey" class="btn btn-again">Submit Another</a>
            <a href="/analysis" class="btn btn-analysis">View Analysis 📊</a>
        </div>
    </div>

</body>
</html>
