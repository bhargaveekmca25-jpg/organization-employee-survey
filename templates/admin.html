<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .err {
            color: red;
            font-size: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>🛡️ Admin Login</h3>
        <p style="font-size:12px; color:#64748b;">
            Only admin can see who responded
        </p>

        {% if error %}
            <div class="err">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input 
                type="password" 
                name="password" 
                placeholder="Password: admin123" 
                required
            >
            <button type="submit">Login</button>
        </form>

        <a href="/" style="font-size:11px; display:block; margin-top:12px;">
            Back to Home
        </a>
    </div>
</body>
</html>
